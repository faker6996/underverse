# Auto Publish @underverse-ui/underverse to npm using OIDC Trusted Publishing
#
# Trigger: Push to main branch with changes in components/ui, packages/underverse, or lib folder

name: Publish Package

on:
  push:
    branches: [main]
    paths:
      - "components/ui/**"
      - "packages/underverse/**"
      - "lib/**"

permissions:
  contents: write
  id-token: write # Required for OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-underverse-main
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Install root dependencies first (needed for building)
      - name: Install root dependencies
        run: npm ci

      # Install package dependencies
      - name: Install package dependencies
        run: npm ci
        working-directory: packages/underverse

      - name: Run repository quality checks
        run: npm run check

      - name: Build documentation application
        run: npm run build

      - name: Build package
        run: npm run build
        working-directory: packages/underverse

      - name: Resolve release version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            npm version patch --no-git-tag-version
            RELEASE_VERSION=$(node -p "require('./package.json').version")
            echo "$PACKAGE_NAME@$CURRENT_VERSION already exists; publishing $RELEASE_VERSION."
          else
            RELEASE_VERSION=$CURRENT_VERSION
            echo "Publishing the pre-bumped version $PACKAGE_NAME@$RELEASE_VERSION."
          fi

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
        working-directory: packages/underverse

      - name: Regenerate release metadata
        run: npm run generate:api
        working-directory: packages/underverse

      # Use Token Auth (Granular Token) + Provenance
      - name: Publish to npm
        run: npm publish --access public --provenance
        working-directory: packages/underverse
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          cd packages/underverse
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json api-reference.json
          git commit -m "chore: bump @underverse-ui/underverse to v$VERSION [skip ci]" || echo "No changes to commit"
          git push
